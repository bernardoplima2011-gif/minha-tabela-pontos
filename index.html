<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Pontos</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Grid de Estatísticas */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .stat-card h3 {
      font-size: 0.875rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-card .value {
      font-size: 2.25rem;
      font-weight: 800;
      margin-top: 0.5rem;
      color: #fff;
    }

    /* Barra de Progresso rumo aos 1.000 pontos */
    .progress-container {
      margin-top: 1rem;
    }

    .progress-bar-bg {
      background: var(--border-color);
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-gradient);
      width: 0%; /* Atualizado via JavaScript */
      transition: width 0.5s ease-out;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    /* Formulário de Registro */
    .form-card form {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    input[type="date"], input[type="number"] {
      flex: 1;
      min-width: 140px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    /* Estilo do Gráfico */
    .chart-card {
      min-height: 300px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Progresso de Pontuação</h1>
    </header>

    <div class="stats-grid">
      <div class="card stat-card">
        <h3>Total Acumulado</h3>
        <div class="value" id="totalPoints">0</div>
        <div class="progress-container">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
          </div>
          <div class="progress-text">
            <span>Meta: 1.000 pts</span>
            <span id="progressPercent">0%</span>
          </div>
        </div>
      </div>

      <div class="card stat-card">
        <h3>Média Diária</h3>
        <div class="value" id="avgPoints">0</div>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.5rem;">Pontos por dia registrado</p>
      </div>
    </div>

    <div class="card form-card">
      <h3>Registrar Dia</h3>
      <form id="pointForm">
        <input type="date" id="inputDate" required />
        <input type="number" id="inputPoints" placeholder="Pontos do dia" required />
        <button type="submit">Salvar</button>
      </form>
    </div>

    <div class="card chart-card">
      <h3>Evolução Diária e Acumulado</h3>
      <canvas id="pointsChart" style="margin-top: 1rem;"></canvas>
    </div>
  </div>

  <script>
    // Inicialização do Supabase
    const SUPABASE_URL = 'https://dcoyzmfelpqpfcayvssa.supabase.co';
    const SUPABASE_KEY = 'SUA_ANON_KEY_AQUI'; // Adicione sua chave pública/anon do Supabase
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Lógica para atualizar a barra de progresso visual
    function updateProgress(total) {
      const target = 1000;
      const percentage = Math.min(Math.round((total / target) * 100), 100);
      document.getElementById('progressBar').style.width = percentage + '%';
      document.getElementById('progressPercent').innerText = percentage + '%';
    }

    // Exemplo do cálculo visual com dados estáticos de teste
    updateProgress(350); 
    document.getElementById('totalPoints').innerText = '350';
  </script>
</body>
  </html>
